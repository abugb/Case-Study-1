worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            # Grafana serves its own subpath; preserve the complete request URI.
            set $grafana_backend group13-grafana:3000;
            proxy_pass http://$grafana_backend$request_uri;
        }

        location / {
            set $product_backend group13-drawing-game:7860;
            proxy_pass http://$product_backend$request_uri;
        }
    }
}
